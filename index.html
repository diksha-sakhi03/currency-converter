<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURRENCY CONVERTER</title>
    <link href="style.css" rel="stylesheet">
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    

</head>
<body>
    <div class="container">
        <h2>Currency converter</h2>
        <form>
            <div class="amount">
                <p> Enter Amount</p>
                <input value="100" type="text">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                        <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png">
                        <select id="from" name="from">
                            <option value="USD">USD</option>
                            <option value="INR">INR</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option>

                        </select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left" id="icon"></i>
                <div class="To">
                    <p>To</p>
                        <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png">
                        <select id="To" name="from">
                            <option value="INR">INR</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option>

                        </select>
                    </div>
                </div>
            </div>
            <p id="ans"> 1USD=80INR </p>
            <button class="btn"> GET EXCHANGE RATE </button>
        </form>
    </div>
    <script src="codes.js"></script>
     <script src="script.js"></script>
     
</body>
</html>
